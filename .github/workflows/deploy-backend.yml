name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - id: 'auth'
      uses: 'google-github-actions/auth@v1'
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v1'

    - name: 'Build and Deploy to Cloud Run'
      run: |
        gcloud builds submit --tag gcr.io/finvision-68f62/finvision-backend ./backend
        gcloud run deploy finvision-backend \
          --image gcr.io/finvision-68f62/finvision-backend \
          --region us-central1 \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars="GOOGLE_CLOUD_PROJECT=finvision-68f62,FIREBASE_SERVICE_ACCOUNT_JSON=${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }},FINNHUB_API_KEY_1=${{ secrets.FINNHUB_API_KEY_1 }},FINNHUB_API_KEY_2=${{ secrets.FINNHUB_API_KEY_2 }},FINNHUB_API_KEY_3=${{ secrets.FINNHUB_API_KEY_3 }},FINNHUB_API_KEY_4=${{ secrets.FINNHUB_API_KEY_4 }},FINNHUB_API_KEY_5=${{ secrets.FINNHUB_API_KEY_5 }},POLYGON_API_KEY_1=${{ secrets.POLYGON_API_KEY_1 }},POLYGON_API_KEY_2=${{ secrets.POLYGON_API_KEY_2 }},POLYGON_API_KEY_3=${{ secrets.POLYGON_API_KEY_3 }},REDDIT_USERNAME=${{ secrets.REDDIT_USERNAME }}"
