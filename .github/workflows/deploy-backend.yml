name: Notify OpenRun of Backend Update

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  notify-openrun:
    runs-on: ubuntu-latest
    steps:
      - name: Ping OpenRun to reload app
        # OpenRun watches the Git repo directly via its GitOps connection.
        # This step pings the OpenRun admin API to trigger an immediate reload
        # rather than waiting for OpenRun's poll interval.
        run: |
          curl -s -X POST \
            -H "X-Auth-Token: ${{ secrets.OPENRUN_ADMIN_TOKEN }}" \
            "${{ secrets.OPENRUN_HOST }}/api/v1/apps/finvision-backend/reload" \
            || echo "Reload ping failed (OpenRun may auto-detect push). Continuing..."
